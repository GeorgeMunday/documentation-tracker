name: Web Scraper

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .github/webscraper/package-lock.json

      - name: Install dependencies
        working-directory: .github/webscraper
        run: npm ci

      - name: Run scraper
        working-directory: .github/webscraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scrape_news.js